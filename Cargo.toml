[workspace]
resolver = "3"
members = [
    "cursor-proxy-errors",
    "cursor-proxy-types",
    "cursor-proxy-agent",
    "cursor-proxy-models",
    "cursor-proxy-auth",
    "cursor-proxy-openai",
    "cursor-proxy-anthropic",
    "cursor-proxy-server",
    "cursor-proxy-test",
]

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
axum-server = { version = "0.8", features = ["tls-rustls"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"
